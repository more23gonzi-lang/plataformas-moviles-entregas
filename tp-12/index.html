<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Editor de Texto - DOM y JavaScript</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-4Q6Gf2aSP4eDXB8Miphtr37CMZZQ5oXLH2yaXMJ2w8e2ZtHTl7GptT4jmndRuHDT" crossorigin="anonymous">
</head>
<body>
    <div class="container my-1 my-sm-2 my-md-4 my-lg-5">
        <h1>Editor de Texto</h1>

        <div class="card">
            <div class="card-body">

                <h2>Texto</h2>

                <p class="texto" id="texto">
                    Lorem ipsum dolor sit amet, consectetur adipiscing elit. Donec elementum auctor libero, vel imperdiet est. Etiam blandit facilisis ex, nec cursus metus pharetra quis. Fusce imperdiet nisl nibh, ac aliquet ante elementum vitae.
                </p>

                <hr class="hr">

                <h2>Editar texto</h2>

                <div class="mb-3">
                    <input 
                        type="text" 
                        id="input-texto" 
                        class="form-control"
                        placeholder="Escribí un texto"
                    >
                </div>

                <hr class="hr">

                <h2>Opciones de Formato</h2>

                <div class="row">

                    <div class="col-12 col-md-4 my-1">
                        <button id="btn-negrita" class="btn d-block w-100 btn-primary" data-formato="negrita">
                            Bold (Negrita)
                        </button>
                    </div>

                    <div class="col-12 col-md-4 my-1">
                        <button id="btn-cursiva" class="btn d-block w-100 btn-primary" data-formato="cursiva">
                            Italic (Cursiva)
                        </button>
                    </div>

                    <div class="col-12 col-md-4 my-1">
                        <button id="btn-subrayado" class="btn d-block w-100 btn-primary" data-formato="subrayado">
                            Underline (Subrayado)
                        </button>
                    </div>

                    <div class="col-12 col-md-4 my-1">
                        <button id="btn-color" class="btn d-block w-100 btn-primary" data-formato="color">
                            Color
                        </button>
                    </div>

                    <div class="col-12 col-md-4 my-1">
                        <button id="btn-aumentar" class="btn d-block w-100 btn-primary">
                            Aumentar tamaño
                        </button>
                    </div>

                    <div class="col-12 col-md-4 my-1">
                        <button id="btn-disminuir" class="btn d-block w-100 btn-primary">
                            Disminuir tamaño
                        </button>
                    </div>

                </div>

            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/js/bootstrap.bundle.min.js" integrity="sha384-j1CDi7MgGQ12Z7Qab0qlWQ/Qqz24Gc6BM0thvEMVjHnfYGF0rmFCozFSxQBxwHKO" crossorigin="anonymous"></script>

    <script type="text/javascript">

        
        const texto = document.querySelector("#texto");
        let tamañoTexto = 16;


       
        function funcionNegrita() {

            if (texto.style.fontWeight === "bold") {
                texto.style.fontWeight = "normal";

                document.querySelector("#btn-negrita").textContent = "Bold (Negrita)";
            } else {
                texto.style.fontWeight = "bold";

                document.querySelector("#btn-negrita").textContent = "Negrita ACTIVADA";
            }
        }


        function funcionCursiva() {
            if (texto.style.fontStyle === "italic") {
                texto.style.fontStyle = "normal";

                document.querySelector("#btn-cursiva").textContent = "Italic (Cursiva)";
            } else {
                texto.style.fontStyle = "italic";

                document.querySelector("#btn-cursiva").textContent = "Cursiva ACTIVADA";
            }
        }


        
         
        function funcionSubrayado() {
            if (texto.style.textDecoration === "underline") {
                texto.style.textDecoration = "none";

                document.querySelector("#btn-subrayado").textContent = "Underline (Subrayado)";
            } else {
                texto.style.textDecoration = "underline";

                document.querySelector("#btn-subrayado").textContent = "Subrayado ACTIVADO";
            }
        }


   
        function funcionColor() {
            if (texto.style.color === "red") {
                texto.style.color = "black";

                document.querySelector("#btn-color").textContent = "Color";
            } else {
                texto.style.color = "red";

                document.querySelector("#btn-color").textContent = "Color ACTIVADO";
            }
        }


    
        function aumentarTamaño() {
            tamañoTexto = tamañoTexto + 2;

            texto.style.fontSize = tamañoTexto + "px";
        }


        
        function disminuirTamaño() {
            if (tamañoTexto > 8) {
                tamañoTexto = tamañoTexto - 2;

                texto.style.fontSize = tamañoTexto + "px";
            }
        }


      
        function handlerBoton(e) {
            const funcionBoton = e.target.dataset.formato;
            switch (funcionBoton) {

                case 'negrita':
                    funcionNegrita();
                    break;

                case 'cursiva':
                    funcionCursiva();
                    break;

                case 'subrayado':
                    funcionSubrayado();
                    break;

                case 'color':
                    funcionColor();
                    break;
            }
        }


     
        document.querySelectorAll('button.btn').forEach(e => 
            e.addEventListener('click', handlerBoton)
        );
        document.querySelector("#btn-aumentar").addEventListener("click", aumentarTamaño);
        document.querySelector("#btn-disminuir").addEventListener("click", disminuirTamaño);
        document.querySelector("#input-texto").addEventListener("input", function(e) {

            texto.textContent = e.target.value;

        });

    </script>
</body>
</html>
