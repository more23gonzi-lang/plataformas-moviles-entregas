<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Tablero de Puntos - DOM y JavaScript</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/css/bootstrap.min.css"
        rel="stylesheet"
        integrity="sha384-4Q6Gf2aSP4eDXB8Miphtr37CMZZQ5oXLH2yaXMJ2w8e2ZtHTl7GptT4jmndRuHDT"
        crossorigin="anonymous">
</head>

<body>

    <div class="container my-1 my-sm-2 my-md-4 my-lg-5">

        <h1>Tablero de Puntos</h1>

        <div class="card">
            <div class="card-body">

                <div class="row text-center">

                   
                    <div class="col-5">

                        <span id="puntaje-local" class="display-1">
                            0
                        </span>

                        <p id="nombre-local" class="m-0">
                            Local
                        </p>

                        <button id="sumar-local"
                            class="btn btn-success mt-2">
                            +
                        </button>

                        <button id="restar-local"
                            class="btn btn-danger mt-2">
                            -
                        </button>

                    </div>


                   
                    <div class="col-2">

                        <span class="display-1">
                            :
                        </span>

                    </div>


                   
                    <div class="col-5">

                        <span id="puntaje-visitante" class="display-1">
                            0
                        </span>

                        <p id="nombre-visitante" class="m-0">
                            Visitante
                        </p>

                        <button id="sumar-visitante"
                            class="btn btn-success mt-2">
                            +
                        </button>

                        <button id="restar-visitante"
                            class="btn btn-danger mt-2">
                            -
                        </button>

                    </div>

                </div>


                <hr class="hr">


                <h2>Actualizar Contador</h2>

                <div class="row">

                    <div class="col-12 col-sm-4 my-1">

                        <button id="punto-local"
                            class="btn d-block w-100 btn-primary">

                            Punto Local

                        </button>

                    </div>


                    <div class="col-12 col-sm-4 my-1">

                        <button id="punto-visitante"
                            class="btn d-block w-100 btn-primary">

                            Punto Visitante

                        </button>

                    </div>


                    <div class="col-12 col-sm-4 my-1">

                        <button id="reinicio"
                            class="btn d-block w-100 btn-danger">

                            Reinicio

                        </button>

                    </div>

                </div>


                <div class="row mt-2">

                    <div class="col-12 col-sm-6 my-1">

                        <button id="invertir"
                            class="btn d-block w-100 btn-warning">

                            Invertir Puntaje

                        </button>

                    </div>


                    <div class="col-12 col-sm-6 my-1">

                        <button id="finalizar"
                            class="btn d-block w-100 btn-dark">

                            Finalizar Partido

                        </button>

                    </div>

                </div>


                <hr class="hr">


                
                <h2>Configuración</h2>

                <div class="row">

                    <div class="col-12 col-md-6">

                        <label class="form-label">
                            Nombre del equipo local
                        </label>

                        <input type="text"
                            id="nuevo-nombre-local"
                            class="form-control"
                            placeholder="Nombre del equipo">

                        <button id="cambiar-nombre-local"
                            class="btn btn-primary mt-2">

                            Cambiar nombre

                        </button>

                    </div>


                    <div class="col-12 col-md-6">

                        <label class="form-label">
                            Nombre del equipo visitante
                        </label>

                        <input type="text"
                            id="nuevo-nombre-visitante"
                            class="form-control"
                            placeholder="Nombre del equipo">

                        <button id="cambiar-nombre-visitante"
                            class="btn btn-primary mt-2">

                            Cambiar nombre

                        </button>

                    </div>

                </div>


                <div class="row mt-3">

                    <div class="col-12 col-md-6">

                        <label class="form-label">
                            Color del equipo local
                        </label>

                        <input type="color"
                            id="color-local"
                            value="#0d6efd"
                            class="form-control">

                    </div>


                    <div class="col-12 col-md-6">

                        <label class="form-label">
                            Color del equipo visitante
                        </label>

                        <input type="color"
                            id="color-visitante"
                            value="#dc3545"
                            class="form-control">

                    </div>

                </div>


                <p class="mt-3">
                    <strong>Atajos de teclado:</strong>
                    A = sumar Local,
                    Z = restar Local,
                    K = sumar Visitante,
                    M = restar Visitante.
                </p>

            </div>
        </div>

    </div>


    <script>

      
        let puntajeLocal = 0;
        let puntajeVisitante = 0;


        const mostrarLocal =
            document.querySelector("#puntaje-local");

        const mostrarVisitante =
            document.querySelector("#puntaje-visitante");


        const botonSumarLocal =
            document.querySelector("#sumar-local");

        const botonRestarLocal =
            document.querySelector("#restar-local");

        const botonSumarVisitante =
            document.querySelector("#sumar-visitante");

        const botonRestarVisitante =
            document.querySelector("#restar-visitante");


        const botonPuntoLocal =
            document.querySelector("#punto-local");

        const botonPuntoVisitante =
            document.querySelector("#punto-visitante");

        const botonReinicio =
            document.querySelector("#reinicio");

        const botonInvertir =
            document.querySelector("#invertir");

        const botonFinalizar =
            document.querySelector("#finalizar");


        
        function actualizarPuntajes() {

            mostrarLocal.textContent = puntajeLocal;

            mostrarVisitante.textContent = puntajeVisitante;

        }


       
        function sumarLocal() {

            puntajeLocal++;

            actualizarPuntajes();

        }


        function restarLocal() {

            if (puntajeLocal > 0) {

                puntajeLocal--;

                actualizarPuntajes();

            }

        }


        
        function sumarVisitante() {

            puntajeVisitante++;

            actualizarPuntajes();

        }


        
        function restarVisitante() {

            if (puntajeVisitante > 0) {

                puntajeVisitante--;

                actualizarPuntajes();

            }

        }


       
        function reiniciar() {

            puntajeLocal = 0;

            puntajeVisitante = 0;

            actualizarPuntajes();


           
            botonSumarLocal.disabled = false;
            botonRestarLocal.disabled = false;

            botonSumarVisitante.disabled = false;
            botonRestarVisitante.disabled = false;

            botonPuntoLocal.disabled = false;
            botonPuntoVisitante.disabled = false;

            botonFinalizar.disabled = false;

        }


       
        function invertirPuntaje() {

            const puntajeTemporal = puntajeLocal;

            puntajeLocal = puntajeVisitante;

            puntajeVisitante = puntajeTemporal;

            actualizarPuntajes();

        }


      
        function finalizarPartido() {

            botonSumarLocal.disabled = true;
            botonRestarLocal.disabled = true;

            botonSumarVisitante.disabled = true;
            botonRestarVisitante.disabled = true;

            botonPuntoLocal.disabled = true;
            botonPuntoVisitante.disabled = true;

            botonFinalizar.disabled = true;

            alert("El partido ha finalizado.");

        }


       
        botonSumarLocal.addEventListener(
            "click",
            sumarLocal
        );

        botonRestarLocal.addEventListener(
            "click",
            restarLocal
        );


        botonSumarVisitante.addEventListener(
            "click",
            sumarVisitante
        );

        botonRestarVisitante.addEventListener(
            "click",
            restarVisitante
        );


        botonPuntoLocal.addEventListener(
            "click",
            sumarLocal
        );

        botonPuntoVisitante.addEventListener(
            "click",
            sumarVisitante
        );


        botonReinicio.addEventListener(
            "click",
            reiniciar
        );


        botonInvertir.addEventListener(
            "click",
            invertirPuntaje
        );


        botonFinalizar.addEventListener(
            "click",
            finalizarPartido
        );


       
        document
            .querySelector("#cambiar-nombre-local")
            .addEventListener("click", function() {

                const nombre =
                    document.querySelector(
                        "#nuevo-nombre-local"
                    ).value;

                if (nombre.trim() !== "") {

                    document.querySelector(
                        "#nombre-local"
                    ).textContent = nombre;

                }

            });


       
        document
            .querySelector("#cambiar-nombre-visitante")
            .addEventListener("click", function() {

                const nombre =
                    document.querySelector(
                        "#nuevo-nombre-visitante"
                    ).value;

                if (nombre.trim() !== "") {

                    document.querySelector(
                        "#nombre-visitante"
                    ).textContent = nombre;

                }

            });


       
        document
            .querySelector("#color-local")
            .addEventListener("input", function() {

                document.querySelector(
                    "#nombre-local"
                ).style.color = this.value;

                document.querySelector(
                    "#puntaje-local"
                ).style.color = this.value;

            });


        document
            .querySelector("#color-visitante")
            .addEventListener("input", function() {

                document.querySelector(
                    "#nombre-visitante"
                ).style.color = this.value;

                document.querySelector(
                    "#puntaje-visitante"
                ).style.color = this.value;

            });


       
        document.addEventListener(
            "keydown",
            function(evento) {

              
                if (evento.key.toLowerCase() === "a") {

                    if (!botonSumarLocal.disabled) {

                        sumarLocal();

                    }

                }


               
                if (evento.key.toLowerCase() === "z") {

                    if (!botonRestarLocal.disabled) {

                        restarLocal();

                    }

                }


               
                if (evento.key.toLowerCase() === "k") {

                    if (!botonSumarVisitante.disabled) {

                        sumarVisitante();

                    }

                }


               
                if (evento.key.toLowerCase() === "m") {

                    if (!botonRestarVisitante.disabled) {

                        restarVisitante();

                    }

                }

            }
        );


       
        actualizarPuntajes();

    </script>

</body>
</html>
