<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Lista de Contactos - DOM y JavaScript</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/css/bootstrap.min.css"
        rel="stylesheet"
        integrity="sha384-4Q6Gf2aSP4eDXB8Miphtr37CMZZQ5oXLH2yaXMJ2w8e2ZtHTl7GptT4jmndRuHDT"
        crossorigin="anonymous">
</head>

<body>

    <div class="container my-1 my-sm-2 my-md-4 my-lg-5">

        <h1>Lista de Contactos</h1>

        <div class="card">
            <div class="card-body">

                <h2>Contactos</h2>

                <ul id="lista-contactos"></ul>

                <hr class="hr">

                <h2>Nuevo Contacto</h2>

                <form id="form-producto">

                    <div class="input-group mb-3">

                        <input type="text"
                            class="form-control"
                            name="nombre"
                            id="input-nombre"
                            placeholder="Nombre"
                            aria-label="Nombre">

                        <input type="text"
                            class="form-control"
                            name="apellido"
                            id="input-apellido"
                            placeholder="Apellido"
                            aria-label="Apellido">

                        <input type="text"
                            class="form-control"
                            name="telefono"
                            id="input-telefono"
                            placeholder="Teléfono"
                            aria-label="Teléfono">

                    </div>

                    <button class="btn btn-primary" type="submit">
                        Agregar Contacto
                    </button>

                </form>

                <hr class="hr">

                <h2>Ordenar contactos</h2>

                <button id="ordenar-nombre" class="btn btn-secondary">
                    Ordenar por Nombre
                </button>

                <button id="ordenar-apellido" class="btn btn-secondary">
                    Ordenar por Apellido
                </button>

                <button id="mostrar-todos" class="btn btn-primary">
                    Mostrar Todos
                </button>

                <button id="mostrar-favoritos" class="btn btn-warning">
                    Mostrar Favoritos
                </button>

            </div>
        </div>

    </div>


    <script>

       
        let contactos = [
            {
                nombre: 'Juan',
                apellido: 'Perez',
                telefono: '1122334455',
                favorito: false
            }
        ];


       
        function agregarContacto(nombre, apellido, telefono) {

          
            if (nombre.trim() === "" ||
                apellido.trim() === "" ||
                telefono.trim() === "") {

                return;
            }


           
            const contacto = {

                nombre: nombre,
                apellido: apellido,
                telefono: telefono,
                favorito: false

            };


            
            contactos.push(contacto);


          
            mostrarListado();

        }


      
        function mostrarListado(listaContactos = contactos) {

            const lista = document.querySelector("#lista-contactos");


            
            lista.innerHTML = "";


            
            listaContactos.forEach(function(contacto) {

               
                const elemento = document.createElement("li");

                elemento.className = "mb-2";


              
                const texto = document.createElement("span");

                texto.textContent =
                    contacto.nombre + " " +
                    contacto.apellido +
                    " - Teléfono: " +
                    contacto.telefono;


                
                const botonFavorito = document.createElement("button");

                if (contacto.favorito) {

                    botonFavorito.textContent = "★ Favorito";

                } else {

                    botonFavorito.textContent = "☆ Favorito";

                }

                botonFavorito.className =
                    "btn btn-warning btn-sm ms-2";


               
                botonFavorito.addEventListener("click", function() {

                    contacto.favorito = !contacto.favorito;

                    mostrarListado(listaContactos);

                });


               
                elemento.appendChild(texto);

                elemento.appendChild(botonFavorito);


                lista.appendChild(elemento);

            });

        }


       
        function ordenarPorNombre() {

            contactos.sort(function(a, b) {

                return a.nombre.localeCompare(b.nombre);

            });


            mostrarListado();

        }


       
        function ordenarPorApellido() {

            contactos.sort(function(a, b) {

                return a.apellido.localeCompare(b.apellido);

            });


            mostrarListado();

        }


        
        function mostrarFavoritos() {

            const favoritos = contactos.filter(function(contacto) {

                return contacto.favorito === true;

            });


            mostrarListado(favoritos);

        }


        
        function mostrarTodos() {

            mostrarListado();

        }


      
        function handlerFormulario(e) {

            e.preventDefault();


            const inputNombre =
                e.target.querySelector("#input-nombre");

            const inputApellido =
                e.target.querySelector("#input-apellido");

            const inputTelefono =
                e.target.querySelector("#input-telefono");


            const nombre = inputNombre.value;

            const apellido = inputApellido.value;

            const telefono = inputTelefono.value;


          
            inputNombre.value = "";

            inputApellido.value = "";

            inputTelefono.value = "";


           
            agregarContacto(nombre, apellido, telefono);

        }


       
        document
            .querySelector("form")
            .addEventListener("submit", handlerFormulario);


      
        document
            .querySelector("#ordenar-nombre")
            .addEventListener("click", ordenarPorNombre);


        document
            .querySelector("#ordenar-apellido")
            .addEventListener("click", ordenarPorApellido);


       
        document
            .querySelector("#mostrar-todos")
            .addEventListener("click", mostrarTodos);


       
        document
            .querySelector("#mostrar-favoritos")
            .addEventListener("click", mostrarFavoritos);


       
        mostrarListado();

    </script>

</body>
</html>
